# ═══════════════════════════════════════════════════════════════════
# Global Inflation Insights — secrets.toml
# NEVER commit real credentials to git.
# On Streamlit Cloud: paste this in App Settings → Secrets.
# ═══════════════════════════════════════════════════════════════════

# ── User credentials (local SHA-256 fallback) ─────────────────────
# Format: username = "sha256hash:role"
# Roles: admin | analyst | viewer
# Generate: python -c "import hashlib; print(hashlib.sha256(b'pw').hexdigest())"
[users]
admin = "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918:admin"
demo  = "d3ad9315b7be5dd53b31a273b3b3aba5defe700808305aa16a3062b76658a791:analyst"

# ── FastAPI backend (enables JWT auth + async ML) ─────────────────
# When set, login uses JWT tokens instead of local SHA-256.
# [backend]
# url = "http://localhost:8000"   # local dev
# url = "https://your-api.railway.app"  # production

# ── Supabase (persistent DB — replaces SQLite) ────────────────────
# 1. Create project at supabase.com
# 2. Settings → API → copy URL and anon key
# [supabase]
# url = "https://your-project.supabase.co"
# key = "your-anon-key"

# ── FRED API (real US macro data — M2, CPI, rates) ────────────────
# Free key at fred.stlouisfed.org/docs/api/api_key.html
# [fred]
# api_key = "your_fred_api_key"

# ── Webhooks ──────────────────────────────────────────────────────
# [webhooks]
# forecast_done     = "https://hooks.slack.com/services/..."
# anomaly_found     = "https://hooks.slack.com/services/..."
# model_trained     = "https://hooks.slack.com/services/..."
# feedback_received = "https://hooks.slack.com/services/..."
# threshold_breach  = "https://hooks.slack.com/services/..."
