# ═══════════════════════════════════════════════════════════════════
# Global Inflation Insights — secrets.toml
# NEVER commit real credentials to git.
# On Streamlit Cloud: paste this content in App Settings → Secrets.
# ═══════════════════════════════════════════════════════════════════

# ── User credentials ─────────────────────────────────────────────
# Format: username = "sha256hash:role"
# Roles: admin | analyst | viewer
# Generate hash: python -c "import hashlib; print(hashlib.sha256(b'yourpassword').hexdigest())"
#
# Defaults:  admin/admin (admin role)   demo/demo123 (analyst role)
[users]
admin = "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918:admin"
demo  = "d3ad9315b7be5dd53b31a273b3b3aba5defe700808305aa16a3062b76658a791:analyst"

# ── Supabase (optional — replaces SQLite for persistent logs) ─────
# 1. Go to supabase.com → New project
# 2. Settings → API → copy Project URL and anon/public key
# 3. Run the SQL in supabase_schema.sql to create tables
# [supabase]
# url = "https://your-project.supabase.co"
# key = "your-anon-key"

# ── FRED API (optional — adds real monthly US data) ───────────────
# 1. Go to fred.stlouisfed.org/docs/api/api_key.html → request free key
# 2. Paste it below and uncomment
# [fred]
# api_key = "your_fred_api_key_here"

# ── Webhooks (optional) ───────────────────────────────────────────
# Paste URLs from Slack / Discord / webhook.site / Make.com / Zapier
# [webhooks]
# forecast_done     = "https://hooks.slack.com/services/..."
# anomaly_found     = "https://hooks.slack.com/services/..."
# model_trained     = "https://hooks.slack.com/services/..."
# feedback_received = "https://hooks.slack.com/services/..."
# threshold_breach  = "https://hooks.slack.com/services/..."
